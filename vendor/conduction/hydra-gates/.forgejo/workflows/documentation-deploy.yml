# Reusable: deploy a prebuilt Docusaurus site (artifact 'docusaurus-build') to Cloudflare
# Workers Static Assets. The caller decides WHETHER to deploy via a caller-side
# `if: github.event_name != 'pull_request'` — Forgejo reusables cannot see the event.
name: Documentation Deploy

on:
  workflow_call:
    inputs:
      cf-project-name:
        description: "Cloudflare Worker name (e.g. 'openregister-docs')"
        required: true
        type: string
      runner-label:
        description: "Runner label to schedule the deploy on (e.g. 'codeberg-small', 'con-ci-oci')"
        required: false
        type: string
        default: "codeberg-small"

jobs:
  deploy:
    name: Deploy to Cloudflare Workers (Static Assets)
    runs-on: ${{ inputs.runner-label }}
    container:
      image: node:24-bookworm
    timeout-minutes: 10
    steps:
      - name: Download build artifact from build job
        uses: https://github.com/actions/download-artifact@v3
        with:
          name: docusaurus-build
          path: ./build
      - name: Generate wrangler.toml
        run: |
          cat > wrangler.toml <<EOF
          name = "${{ inputs.cf-project-name }}"
          compatibility_date = "2026-05-30"

          [assets]
          directory = "./build"
          EOF
          cat wrangler.toml
      - name: Deploy to Cloudflare Workers (Static Assets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx -y wrangler@latest deploy
      - name: Print deployment summary
        run: |
          echo "Deployed ${{ inputs.cf-project-name }} (${GITHUB_SHA:0:7})"
