# Reusable Stable Release workflow for Forgejo Actions on Codeberg.
#
# Translated from the GitHub Actions original
# (ConductionNL/.github .github/workflows/release-stable.yml).
# Calculates the next semver from PR labels, builds the Nextcloud
# app, signs the tarball, creates a Codeberg release, and pushes
# to the Nextcloud App Store.
#
# Compared with the GH original:
#   * Runs in a `php:8.3-cli` container on `runs-on: codeberg-medium`.
#   * `actions-ecosystem/action-bump-semver` inlined as bash.
#   * `gh api` replaced by curl against Codeberg's API.
#   * `ncipollo/release-action` and `svenstaro/upload-release-action`
#     replaced by direct POST to Codeberg's releases endpoint and
#     POST to its release-assets endpoint.
#   * `secrets.GITHUB_TOKEN` becomes `secrets.CODEBERG_TOKEN` (each
#     consuming repo must define this PAT — Codeberg has no
#     auto-provided forge token for Actions).
#   * App Store download URL points at Codeberg release assets, not
#     github.com.
#   * NC App Store push logic ported verbatim — same endpoint, same
#     signing, same idempotent registration handling.

name: Stable Release

on:
  workflow_call:
    inputs:
      app-name:
        description: "Nextcloud app ID (must match appinfo/info.xml)"
        required: true
        type: string
      php-version:
        description: "PHP version for building"
        required: false
        type: string
        default: "8.3"
      node-version:
        description: "Node.js version for building"
        required: false
        type: string
        default: "24"
      verify-vendor-deps:
        description: "Enable vendor dependency verification after composer install"
        required: false
        type: boolean
        default: false
      vendor-check-paths:
        description: "Comma-separated vendor paths to verify exist (e.g. 'openai-php/client/src,theodo-group/llphant/src')"
        required: false
        type: string
        default: ""
      extra-rsync-excludes:
        description: "Additional rsync --exclude flags (one per line, e.g. '/data')"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: codeberg-medium
    container:
      image: php:8.3-cli
    timeout-minutes: 10
    steps:

      - name: Install base tooling
        # The php:8.3-cli image is intentionally minimal. Install
        # everything the rest of the job needs in one apt run.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates gnupg jq rsync unzip zip \
            openssl libzip-dev libpng-dev
          docker-php-ext-install -j"$(nproc)" zip gd
          curl -sS https://getcomposer.org/installer | php -- \
            --install-dir=/usr/local/bin --filename=composer
          # Node.js for actions/checkout@v4 + setup-node@v4 (JS actions):
          # php:8.3-cli has no node and Codeberg's runner does not inject it.
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          # node will be installed by setup-node below; nothing to
          # do here.

      - name: Checkout code
        uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Version calculation from PR labels ──

      - name: Get merged PR labels
        id: pr_label
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # Find the PR that was just merged by querying Codeberg's
          # API for PRs associated with this commit. The endpoint
          # /commits/{sha}/pulls is not part of the Gitea/Codeberg
          # API, so we use the issues search ("merged + sha") via
          # /repos/{owner}/{repo}/issues/search?q=&type=pulls.
          MERGE_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          PR_JSON=$(curl -s \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Accept: application/json" \
            "https://codeberg.org/api/v1/repos/${REPO}/commits/${MERGE_SHA}/pull" 2>/dev/null || echo '{}')

          PR_NUMBER=$(echo "${PR_JSON}" | jq -r '.number // empty' 2>/dev/null || echo "")
          LABELS=$(echo "${PR_JSON}" | jq -r '.labels[]?.name // empty' 2>/dev/null || echo "")

          # Fallback: if the /commits/{sha}/pull endpoint isn't
          # available, search merged PRs by SHA in the commit body.
          if [ -z "${PR_NUMBER}" ]; then
            SEARCH_JSON=$(curl -s \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              "https://codeberg.org/api/v1/repos/${REPO}/pulls?state=closed&sort=newest&limit=20" 2>/dev/null || echo '[]')
            PR_NUMBER=$(echo "${SEARCH_JSON}" | jq -r --arg sha "${MERGE_SHA}" '[.[] | select(.merge_commit_sha==$sha)][0].number // empty')
            LABELS=$(echo "${SEARCH_JSON}" | jq -r --arg sha "${MERGE_SHA}" '[.[] | select(.merge_commit_sha==$sha)][0].labels[]?.name // empty')
          fi

          echo "Merged PR: #${PR_NUMBER:-none}"

          BUMP="patch"
          for label in ${LABELS}; do
            case "${label}" in
              major) BUMP="major"; break ;;
              minor) BUMP="minor"; break ;;
              patch) BUMP="patch"; break ;;
            esac
          done

          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Bump level: ${BUMP}"

      - name: Get latest version tag
        id: current_version
        run: |
          # Allow git to operate on the working tree even though
          # the container runs as root and the repo is owned by
          # the runner user.
          git config --global --add safe.directory "$(pwd)"

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1 || true)

          if [ -z "${LATEST_TAG}" ]; then
            VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | sed 's/-.*//')
            echo "No git tags found, using info.xml baseline: ${VERSION}"
          else
            VERSION="${LATEST_TAG#v}"
            echo "Latest stable tag: ${LATEST_TAG} (${VERSION})"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          BUMP="${{ steps.pr_label.outputs.bump }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT}"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

          case "${BUMP}" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            *)     NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEW_VERSION} (from ${CURRENT} +${BUMP})"

      - name: Set version env
        run: |
          VERSION="${{ steps.next_version.outputs.new_version }}"
          echo "NEW_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APP_NAME=${{ inputs.app-name }}" >> "$GITHUB_ENV"
          echo "Releasing stable version: ${VERSION}"

      # ── Build ──

      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install and build frontend
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build
          else
            echo "No package.json found, skipping frontend build"
          fi

      - name: Install composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --optimize-autoloader --classmap-authoritative
          else
            echo "No composer.json found, skipping composer install"
          fi

      # ── Package ──

      - name: Copy files into package directory
        run: |
          mkdir -p "package/${{ inputs.app-name }}"
          rsync -a \
            --exclude='/package' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.forgejo' \
            --exclude='/.claude' \
            --exclude='/.cursor' \
            --exclude='/.vscode' \
            --exclude='/.nextcloud' \
            --exclude='/docker' \
            --exclude='/docker-compose.yml' \
            --exclude='/docs' \
            --exclude='/website' \
            --exclude='/node_modules' \
            --exclude='/src' \
            --exclude='/phpcs-custom-sniffs' \
            --exclude='/resources' \
            --exclude='/tests' \
            --exclude='/data' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/composer-setup.php' \
            --exclude='/phpcs.xml' \
            --exclude='/phpmd.xml' \
            --exclude='/psalm.xml' \
            --exclude='/phpunit.xml' \
            --exclude='/phpunit-unit.xml' \
            --exclude='/.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='/jest.config.js' \
            --exclude='/webpack.config.js' \
            --exclude='/tsconfig.json' \
            --exclude='/.babelrc' \
            --exclude='/.eslintrc.js' \
            --exclude='/.prettierrc' \
            --exclude='/stylelint.config.js' \
            --exclude='/.spectral.yml' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.php-cs-fixer.dist.php' \
            --exclude='/.nvmrc' \
            --exclude='/changelog-ci-config.json' \
            --exclude='/coverage.txt' \
            --exclude='/signing-key.key' \
            --exclude='/signing-cert.crt' \
            --exclude='/openapi.json' \
            --exclude='/*_ANALYSIS.md' \
            --exclude='/*_FIX.md' \
            --exclude='/*_SUMMARY.md' \
            --exclude='/*_GUIDE.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/CONTRIBUTING.md' \
            ${{ inputs.extra-rsync-excludes }} \
            ./ "package/${{ inputs.app-name }}/"

      - name: Inject version into package info.xml
        run: |
          sed -i "s|<version>.*</version>|<version>${NEW_VERSION}</version>|" \
            "package/${{ inputs.app-name }}/appinfo/info.xml"
          echo "Injected version ${NEW_VERSION} into package info.xml"
          grep '<version>' "package/${{ inputs.app-name }}/appinfo/info.xml"

      - name: Verify package contents
        if: inputs.verify-vendor-deps
        run: |
          if [ ! -d "package/${{ inputs.app-name }}/vendor" ]; then
            echo "ERROR: vendor directory not found in package"
            exit 1
          fi

          IFS=',' read -ra PATHS <<< "${{ inputs.vendor-check-paths }}"
          for check_path in "${PATHS[@]}"; do
            check_path=$(echo "${check_path}" | xargs)
            if [ -n "${check_path}" ] && [ ! -d "package/${{ inputs.app-name }}/vendor/${check_path}" ]; then
              echo "ERROR: vendor/${check_path} not found in package"
              exit 1
            fi
          done

          echo "Package vendor directory verified"

      # ── Sign & Release ──

      - name: Prepare signing credentials
        run: |
          printf '%s' "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > signing-key.key
          printf '%s' "${{ secrets.NEXTCLOUD_SIGNING_CERT }}" > signing-cert.crt

      - name: Create tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz "${{ inputs.app-name }}"

      - name: Sign tarball
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz \
            | openssl base64 -out nextcloud-release.signature

      - name: Upload tarball as artifact
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: release-${{ inputs.app-name }}-${{ env.NEW_VERSION }}
          path: |
            nextcloud-release.tar.gz
            nextcloud-release.signature
          retention-days: 90

      - name: Create Codeberg release
        id: cb_release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          TAG="v${NEW_VERSION}"
          ASSET_NAME="${{ inputs.app-name }}-${NEW_VERSION}.tar.gz"

          # Create the release. Codeberg's Gitea-compatible API will
          # auto-create the tag at the workflow's commit if it does
          # not exist yet.
          BODY_JSON=$(jq -nc \
            --arg tag "${TAG}" \
            --arg name "Release ${NEW_VERSION}" \
            --arg target "${{ github.sha }}" \
            '{tag_name:$tag, target_commitish:$target, name:$name, draft:false, prerelease:false}')

          REL_RESP=$(curl -s -w "\n%{http_code}" \
            -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${BODY_JSON}")

          REL_CODE=$(echo "${REL_RESP}" | tail -n1)
          REL_BODY=$(echo "${REL_RESP}" | sed '$d')

          if [ "${REL_CODE}" = "201" ]; then
            REL_ID=$(echo "${REL_BODY}" | jq -r '.id')
            echo "Created release id ${REL_ID} for tag ${TAG}"
          else
            # Already exists? Look it up by tag.
            echo "POST release returned HTTP ${REL_CODE}; checking if tag already exists..."
            EXIST_RESP=$(curl -s \
              -H "Authorization: token ${CODEBERG_TOKEN}" \
              "https://codeberg.org/api/v1/repos/${REPO}/releases/tags/${TAG}")
            REL_ID=$(echo "${EXIST_RESP}" | jq -r '.id // empty')
            if [ -z "${REL_ID}" ]; then
              echo "ERROR: failed to create release and tag does not exist"
              echo "${REL_BODY}"
              exit 1
            fi
            echo "Reusing existing release id ${REL_ID}"
          fi

          echo "release_id=${REL_ID}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

          # Upload tarball as a release asset.
          UP_CODE=$(curl -s -o /tmp/asset-resp.json -w "%{http_code}" \
            -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases/${REL_ID}/assets?name=${ASSET_NAME}" \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -F "attachment=@nextcloud-release.tar.gz")

          if [ "${UP_CODE}" = "201" ]; then
            ASSET_URL=$(jq -r '.browser_download_url' /tmp/asset-resp.json)
            echo "Uploaded asset: ${ASSET_URL}"
            echo "asset_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: asset upload returned HTTP ${UP_CODE}"
            cat /tmp/asset-resp.json || true
            exit 1
          fi

      - name: Register and upload to Nextcloud App Store
        run: |
          # App Store requires a download URL ending in .tar.gz. Codeberg's asset
          # browser_download_url is an /attachments/<uuid> URL (no extension), so
          # always use the predictable release-download path.
          DOWNLOAD_URL="https://codeberg.org/${{ github.repository }}/releases/download/v${NEW_VERSION}/${{ inputs.app-name }}-${NEW_VERSION}.tar.gz"

          echo "Ensuring ${{ inputs.app-name }} is registered on App Store..."

          REG_SIGNATURE=$(printf '%s' "${{ inputs.app-name }}" \
            | openssl dgst -sha512 -sign signing-key.key | openssl base64 -A)
          CERT_CONTENT=$(cat signing-cert.crt)

          REG_CODE=$(curl -s -o /tmp/register-response.json -w "%{http_code}" \
            -X POST "https://apps.nextcloud.com/api/v1/apps" \
            -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"certificate\": $(echo "${CERT_CONTENT}" | jq -Rs .), \"signature\": \"${REG_SIGNATURE}\"}")

          case "${REG_CODE}" in
            200|201) echo "App registered successfully (first time)" ;;
            *)
              REG_BODY=$(cat /tmp/register-response.json 2>/dev/null || echo "")
              if echo "${REG_BODY}" | grep -qi "already"; then
                echo "App already registered"
              else
                echo "=== App Store REGISTER HTTP ${REG_CODE} ==="; echo "${REG_BODY}"; echo "==="
                echo "Continuing with release upload..."
              fi
              ;;
          esac

          # Sign the release tarball
          SIGNATURE=$(openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz \
            | openssl base64 -A)

          echo "Uploading release to App Store (nightly: false)..."
          # The App Store fetches DOWNLOAD_URL the instant we POST, but the just-created
          # Codeberg release asset can be briefly unservable (replica lag) -> transient
          # non-200. Retry with backoff so a successful build+tag is not discarded by a
          # momentary download race. Keep the hard gate: still fail if all attempts fail.
          UPLOAD_CODE=""
          for attempt in 1 2 3 4 5 6; do
            UPLOAD_CODE=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
              -X POST "https://apps.nextcloud.com/api/v1/apps/releases" \
              -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"download\": \"${DOWNLOAD_URL}\", \"signature\": \"${SIGNATURE}\", \"nightly\": false}")
            echo "=== App Store upload attempt ${attempt}: HTTP ${UPLOAD_CODE} ==="
            echo "--- response body ---"
            cat /tmp/upload-response.json 2>/dev/null; echo
            echo "---------------------"
            if [ "${UPLOAD_CODE}" = "200" ] || [ "${UPLOAD_CODE}" = "201" ]; then break; fi
            echo "Upload non-success; backing off before retry..."
            sleep $((attempt * 10))
          done
          if [ "${UPLOAD_CODE}" = "200" ] || [ "${UPLOAD_CODE}" = "201" ]; then
            echo "Release uploaded to App Store successfully"
          else
            echo "ERROR: App Store upload failed after retries (HTTP ${UPLOAD_CODE}) — see response body above"
            exit 1
          fi

      - name: Verify release
        run: |
          echo "=== Stable Release Summary ==="
          echo "App: ${{ inputs.app-name }}"
          echo "Version: ${NEW_VERSION}"
          echo "Tag: v${NEW_VERSION}"
          echo ""
          echo "info.xml in tarball:"
          tar -xOf nextcloud-release.tar.gz "${{ inputs.app-name }}/appinfo/info.xml" | grep '<version>'
          echo ""
          echo "Tarball size: $(du -h nextcloud-release.tar.gz | cut -f1)"

      - name: Clean up signing credentials
        if: always()
        run: rm -f signing-key.key signing-cert.crt
