name: Release

on:
  workflow_call:
    inputs:
      release-type:
        description: "Release type: unstable, beta, or stable"
        required: true
        type: string
      app-name:
        description: "Nextcloud app ID (must match appinfo/info.xml)"
        required: true
        type: string
      php-version:
        description: "PHP version for building"
        required: false
        type: string
        default: "8.3"
      node-version:
        description: "Node.js version for building"
        required: false
        type: string
        default: "20"
      verify-vendor-deps:
        description: "Enable vendor dependency verification after composer install"
        required: false
        type: boolean
        default: false
      vendor-check-paths:
        description: "Comma-separated vendor paths to verify exist (e.g. 'openai-php/client/src,theodo-group/llphant/src')"
        required: false
        type: string
        default: ""
      extra-rsync-excludes:
        description: "Additional rsync --exclude flags (one per line, e.g. '/data')"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Observed across 73 executions of the shared release jobs: median 1.3 min,
    # p95 3.0 min, max 4.0 min (nextcloud-vue). A release is expensive to fail
    # spuriously — it builds the frontend (measured at 211 s under load),
    # installs composer deps, packages and signs a tarball and uploads it — so
    # this is bounded at 45 min, ~11x the worst run, purely as a hang stop.
    timeout-minutes: 45
    steps:

      - name: Validate release type
        run: |
          if [[ "${{ inputs.release-type }}" != "unstable" && "${{ inputs.release-type }}" != "beta" && "${{ inputs.release-type }}" != "stable" ]]; then
            echo "::error::Invalid release-type '${{ inputs.release-type }}'. Must be: unstable, beta, or stable"
            exit 1
          fi
          echo "Release type: ${{ inputs.release-type }}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Version calculation ──

      - name: Get latest stable version
        id: stable_version
        run: |
          # Find latest stable version tag (vX.Y.Z without prerelease suffix)
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # Fallback: read from info.xml on main
            git fetch origin main 2>/dev/null || true
            VERSION=$(git show origin/main:appinfo/info.xml 2>/dev/null | grep -oP '(?<=<version>)[^<]+' | sed 's/-.*//' || echo "")

            if [ -z "$VERSION" ]; then
              # Last resort: current info.xml
              VERSION=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | sed 's/-.*//')
            fi

            echo "No git tags found, using info.xml baseline: $VERSION"
          else
            VERSION="${LATEST_TAG#v}"
            echo "Latest stable tag: $LATEST_TAG ($VERSION)"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Calculate unstable version
        if: inputs.release-type == 'unstable'
        run: |
          STABLE="${{ steps.stable_version.outputs.version }}"
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          UNSTABLE_VERSION="${STABLE}-unstable.${TIMESTAMP}"

          echo "NEW_VERSION=$UNSTABLE_VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Unstable version: $UNSTABLE_VERSION (stable baseline: $STABLE)"

      - name: Calculate beta version
        if: inputs.release-type == 'beta'
        run: |
          STABLE="${{ steps.stable_version.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$STABLE"

          # Beta is always one patch ahead of stable
          NEXT_PATCH=$(( ${PARTS[2]} + 1 ))
          TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")

          BETA_VERSION="${PARTS[0]}.${PARTS[1]}.${NEXT_PATCH}-beta.${TIMESTAMP}"

          echo "NEW_VERSION=$BETA_VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Beta version: $BETA_VERSION (stable baseline: $STABLE)"

      - name: Get merged PR labels
        if: inputs.release-type == 'stable'
        id: pr_label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the PR that was just merged (the merge commit on main)
          MERGE_SHA="${{ github.sha }}"

          # Query GitHub for PRs associated with this commit
          PR_DATA=$(gh api repos/${{ github.repository }}/commits/${MERGE_SHA}/pulls \
            --jq '.[0] | {number: .number, labels: [.labels[].name]}' 2>/dev/null || echo '{}')

          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number // empty')
          echo "Merged PR: #${PR_NUMBER:-none}"

          # Determine bump level from labels (default: patch)
          BUMP="patch"
          LABELS=$(echo "$PR_DATA" | jq -r '.labels[]? // empty' 2>/dev/null)

          for label in $LABELS; do
            case "$label" in
              major) BUMP="major"; break ;;
              minor) BUMP="minor"; break ;;
              patch) BUMP="patch"; break ;;
            esac
          done

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Bump level: $BUMP"

      - name: Calculate stable version
        if: inputs.release-type == 'stable'
        id: next_version
        uses: actions-ecosystem/action-bump-semver@v1
        with:
          current_version: ${{ steps.stable_version.outputs.version }}
          level: ${{ steps.pr_label.outputs.bump }}

      - name: Set stable version env
        if: inputs.release-type == 'stable'
        run: |
          VERSION="${{ steps.next_version.outputs.new_version }}"
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_NAME=${{ inputs.app-name }}" >> $GITHUB_ENV
          echo "Releasing stable version: $VERSION"

      # ── Build ──

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: zip, gd

      - name: Install and build frontend
        run: |
          if [ -f "package.json" ]; then
            npm ci
            npm run build
          else
            echo "No package.json found, skipping frontend build"
          fi

      - name: Install composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --no-dev --optimize-autoloader --classmap-authoritative
          else
            echo "No composer.json found, skipping composer install"
          fi

      - name: Verify vendor dependencies
        if: inputs.verify-vendor-deps
        run: |
          echo "Checking critical vendor dependencies..."

          if [ ! -d "vendor" ] || [ -z "$(ls -A vendor 2>/dev/null)" ]; then
            echo "ERROR: vendor directory is missing or empty"
            exit 1
          fi

          IFS=',' read -ra PATHS <<< "${{ inputs.vendor-check-paths }}"
          missing=0
          for check_path in "${PATHS[@]}"; do
            check_path=$(echo "$check_path" | xargs)
            if [ -n "$check_path" ] && [ ! -d "vendor/$check_path" ]; then
              echo "ERROR: vendor/$check_path not found"
              missing=1
            fi
          done

          if [ $missing -eq 1 ]; then
            echo "HINT: Check composer.json dependencies and composer install output"
            exit 1
          fi

          echo "✓ All critical dependencies verified"

      # ── Package ──

      # ── Commit the version to the repository, BEFORE the tag exists ──
      #
      # This retires "Version Is Not In The Repository". The version used to
      # exist only inside the built package: `sed` rewrote appinfo/info.xml in
      # the copy under package/, and the committed file kept whatever stale
      # number was last hand-edited.
      #
      # That is incompatible with Nextcloud's own release template, which reads
      # the version FROM appinfo/info.xml and asserts the tag matches:
      #
      #     [ "$APP_VERSION" = "v$(xpath info.xml //version)" ]
      #
      # Following Nextcloud means the repository has to be the source of truth,
      # so the bump is committed here and the tag is cut from that commit. The
      # tag then names a tree whose info.xml says what the tag says.
      #
      # `[skip ci]` because this commit changes one number in one XML file and
      # the quality suite has already run on the code being released. Without
      # it, every release starts a second full pipeline on a tree that differs
      # from the tested one by a version string.
      #
      # No push on a dry run and no push when the number has not moved — a
      # re-run of a release that already happened must not create an empty
      # commit and re-tag it.
      - name: Commit the version bump
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '(?<=<version>)[^<]+' appinfo/info.xml | head -1)
          if [ "$CURRENT" = "${{ env.NEW_VERSION }}" ]; then
            echo "appinfo/info.xml already says ${{ env.NEW_VERSION }} — nothing to commit."
            exit 0
          fi
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" appinfo/info.xml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appinfo/info.xml
          git commit -m "chore(release): ${{ env.NEW_VERSION }} [skip ci]"
          if ! git push origin HEAD:${{ github.ref_name }}; then
            echo "::error::Could not push the version bump to ${{ github.ref_name }}."
            echo "The tag must name a tree whose appinfo/info.xml matches it, so this"
            echo "is a hard stop rather than a warning — releasing past it would put"
            echo "the old version number inside a package labelled with the new one."
            echo "If the branch is protected, allow the GitHub Actions bot to push to"
            echo "it, or route the bump through a PR before the release runs."
            exit 1
          fi
          echo "Committed ${CURRENT} -> ${{ env.NEW_VERSION }} on ${{ github.ref_name }}"

      - name: Copy files into package directory
        run: |
          mkdir -p package/${{ inputs.app-name }}
          rsync -a --progress \
            --exclude='/package' \
            --exclude='/.git' \
            --exclude='/.github' \
            --exclude='/.claude' \
            --exclude='/.hydra' \
            --exclude='/.cursor' \
            --exclude='/.vscode' \
            --exclude='/.nextcloud' \
            --exclude='/docker' \
            --exclude='/docker-compose.yml' \
            --exclude='/docs' \
            --exclude='/docusaurus' \
            --exclude='/website' \
            --exclude='/node_modules' \
            --exclude='/src' \
            --exclude='/phpcs-custom-sniffs' \
            --exclude='/resources' \
            --exclude='/tests' \
            --exclude='/data' \
            --exclude='/openspec' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/composer-setup.php' \
            --exclude='/phpcs.xml' \
            --exclude='/phpmd.xml' \
            --exclude='/psalm.xml' \
            --exclude='/phpunit.xml' \
            --exclude='/phpunit-unit.xml' \
            --exclude='/.phpunit.cache' \
            --exclude='.phpunit.result.cache' \
            --exclude='/jest.config.js' \
            --exclude='/eslint.config.js' \
            --exclude='/webpack.config.js' \
            --exclude='/tsconfig.json' \
            --exclude='/.babelrc' \
            --exclude='/.eslintrc.js' \
            --exclude='/.prettierrc' \
            --exclude='/stylelint.config.js' \
            --exclude='/.spectral.yml' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.php-cs-fixer.dist.php' \
            --exclude='/.nvmrc' \
            --exclude='/changelog-ci-config.json' \
            --exclude='/coverage.txt' \
            --exclude='/.coverage-baseline' \
            --exclude='/signing-key.key' \
            --exclude='/signing-cert.crt' \
            --exclude='/openapi.json' \
            --exclude='/.phpqa.yml' \
            --exclude='/.grype.yaml' \
            --exclude='/sbom.cdx.json' \
            --exclude='/bom-npm-test.cdx.json' \
            --exclude='/*_ANALYSIS.md' \
            --exclude='/*_FIX.md' \
            --exclude='/*_SUMMARY.md' \
            --exclude='/*_GUIDE.md' \
            --exclude='/CHANGELOG.md' \
            --exclude='/CONTRIBUTING.md' \
            ${{ inputs.extra-rsync-excludes }} \
            ./ package/${{ inputs.app-name }}/

      - name: Inject version into package info.xml
        run: |
          sed -i "s|<version>.*</version>|<version>${{ env.NEW_VERSION }}</version>|" \
            package/${{ inputs.app-name }}/appinfo/info.xml
          echo "Injected version ${{ env.NEW_VERSION }} into package info.xml"
          grep '<version>' package/${{ inputs.app-name }}/appinfo/info.xml

      - name: Verify package contents
        if: inputs.verify-vendor-deps
        run: |
          if [ ! -d "package/${{ inputs.app-name }}/vendor" ]; then
            echo "ERROR: vendor directory not found in package"
            exit 1
          fi

          IFS=',' read -ra PATHS <<< "${{ inputs.vendor-check-paths }}"
          for check_path in "${PATHS[@]}"; do
            check_path=$(echo "$check_path" | xargs)
            if [ -n "$check_path" ] && [ ! -d "package/${{ inputs.app-name }}/vendor/$check_path" ]; then
              echo "ERROR: vendor/$check_path not found in package"
              exit 1
            fi
          done

          echo "✓ Package vendor directory verified"

      # ── Sign & Release ──

      - name: Prepare signing credentials
        run: |
          echo "${{ secrets.NEXTCLOUD_SIGNING_KEY }}" > signing-key.key
          echo "${{ secrets.NEXTCLOUD_SIGNING_CERT }}" > signing-cert.crt

      # ── Nextcloud's own integrity signature ──
      #
      # THE GAP THIS CLOSES: every release this fleet has ever published went
      # out WITHOUT appinfo/signature.json. We signed the tarball — which is
      # what the App Store API authenticates the upload with — and stopped
      # there. Nextcloud's integrity checker verifies something else entirely:
      # a per-file manifest INSIDE the app directory. Without it, `occ
      # integrity:check-app <app>` reports the app as unverifiable, and an
      # administrator running an integrity check sees our apps as the ones that
      # cannot be vouched for.
      #
      # `occ` has to come from somewhere, so the server is fetched at the
      # version the app declares it needs. Reading min-version from info.xml
      # rather than hardcoding it is the same principle as
      # icewind1991/nextcloud-version-matrix: the release cannot drift from what
      # the app says it supports, because it is computed from it.
      #
      # NOT continue-on-error. An unsigned package that ships looks exactly like
      # a signed one until an administrator checks, which is precisely the class
      # of silent gap this whole change is about.
      - name: Fetch Nextcloud server for occ
        run: |
          set -euo pipefail
          # ANCHORED TO THE <nextcloud> ELEMENT ON PURPOSE. info.xml carries
          # min-version on <php> too, and <php> comes FIRST in every fleet
          # app. Measured across all 18 on 2026-08-12, an unanchored
          # `(?<=min-version=")[0-9]+` returned:
          #   13 apps -> 8    (from <php min-version="8.3"/>)
          #   portaliq -> 28  (from a <nextcloud> further down, but the WRONG one)
          # The first form fails loudly, because updates.nextcloud.com has no
          # NC 8. The second does not: it resolves a real server and signs the
          # app against a Nextcloud four majors below what it supports.
          NCVERSION=$(grep -oP '<nextcloud[^>]*min-version="\K[0-9]+' appinfo/info.xml | head -1)
          [ -n "${NCVERSION}" ] || { echo "::error::appinfo/info.xml declares no <nextcloud min-version>."; exit 1; }
          echo "App declares min-version ${NCVERSION}; fetching that server to sign with."
          URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=stable&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::warning::No stable download for NC ${NCVERSION}; falling back to the beta channel."
            URL=$(curl -sS "https://updates.nextcloud.com/updater_server/latest?channel=beta&version=${NCVERSION}" | jq -r '.downloads.zip[0]')
          fi
          [ -n "$URL" ] && [ "$URL" != "null" ] || { echo "::error::Could not resolve a Nextcloud server download for min-version ${NCVERSION}."; exit 1; }
          curl -sSL "$URL" -o nextcloud.zip
          unzip -q nextcloud.zip
          test -f nextcloud/occ || { echo "::error::The downloaded archive has no nextcloud/occ."; exit 1; }

      - name: Sign the app with occ integrity:sign-app
        run: |
          set -euo pipefail
          php nextcloud/occ integrity:sign-app \
            --privateKey="$PWD/signing-key.key" \
            --certificate="$PWD/signing-cert.crt" \
            --path="$PWD/package/${{ inputs.app-name }}"
          SIG="package/${{ inputs.app-name }}/appinfo/signature.json"
          # POSITIVE CONTROL. `integrity:sign-app` exits 0 on several paths that
          # produce no manifest, so the exit code alone is not evidence. Assert
          # the artefact exists and actually enumerates files.
          test -f "$SIG" || { echo "::error::integrity:sign-app exited 0 but wrote no ${SIG}. The package would ship unsigned."; exit 1; }
          COUNT=$(jq -r '.hashes | length' "$SIG" 2>/dev/null || echo 0)
          [ "${COUNT:-0}" -gt 0 ] || { echo "::error::${SIG} exists but hashes 0 files — an empty manifest verifies nothing."; exit 1; }
          echo "Signed ${COUNT} file(s) into ${SIG}"

      - name: Create tarball
        run: |
          cd package && tar -czf ../nextcloud-release.tar.gz ${{ inputs.app-name }}

      - name: Sign tarball
        run: |
          openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -out nextcloud-release.signature

      # Sibling digest for installers that fetch the archive over plain HTTPS
      # rather than through the app store. The App Versions app looks for a
      # .sha256 next to the .tar.gz and verifies against it; without one it
      # falls back to trusting whatever it downloaded the first time. The
      # file holds the bare digest, because the archive is renamed on upload
      # and a "digest  filename" line would name the wrong file.
      - name: Compute SHA-256 of tarball
        run: |
          sha256sum nextcloud-release.tar.gz | cut -d' ' -f1 > nextcloud-release.tar.gz.sha256
          echo "SHA-256: $(cat nextcloud-release.tar.gz.sha256)"

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release-type }}-${{ inputs.app-name }}-${{ env.NEW_VERSION }}
          path: |
            nextcloud-release.tar.gz
            nextcloud-release.tar.gz.sha256
            nextcloud-release.signature
          retention-days: ${{ inputs.release-type == 'stable' && 90 || (inputs.release-type == 'beta' && 30 || 7) }}

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.NEW_VERSION }}
          name: "${{ inputs.release-type == 'stable' && 'Release' || (inputs.release-type == 'beta' && 'Beta' || 'Unstable') }} ${{ env.NEW_VERSION }}"
          draft: false
          prerelease: ${{ inputs.release-type != 'stable' }}
          generateReleaseNotes: true

      - name: Attach tarball to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: nextcloud-release.tar.gz
          asset_name: ${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz
          tag: v${{ env.NEW_VERSION }}
          overwrite: true

      # Named to sit beside the tarball: <app>-<version>.tar.gz.sha256. The
      # installer derives this name from the archive's own URL, so the suffix
      # follows the renamed asset rather than the build file.
      - name: Attach SHA-256 to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ github.token }}
          file: nextcloud-release.tar.gz.sha256
          asset_name: ${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz.sha256
          tag: v${{ env.NEW_VERSION }}
          overwrite: true

      # ── App Store upload (beta and stable only) ──

      - name: Register and upload to Nextcloud App Store
        if: inputs.release-type != 'unstable'
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ env.NEW_VERSION }}/${{ inputs.app-name }}-${{ env.NEW_VERSION }}.tar.gz"
          NIGHTLY="${{ inputs.release-type == 'beta' && 'true' || 'false' }}"

          # Always attempt registration (idempotent — already-registered apps return 200/4xx harmlessly)
          echo "Ensuring ${{ inputs.app-name }} is registered on App Store..."

          REG_SIGNATURE=$(echo -n "${{ inputs.app-name }}" | openssl dgst -sha512 -sign signing-key.key | openssl base64 -A)
          CERT_CONTENT=$(cat signing-cert.crt)

          REG_CODE=$(curl -s -o /tmp/register-response.json -w "%{http_code}" \
            -X POST "https://apps.nextcloud.com/api/v1/apps" \
            -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"certificate\": $(echo "$CERT_CONTENT" | jq -Rs .), \"signature\": \"$REG_SIGNATURE\"}")

          case "$REG_CODE" in
            200|201) echo "✓ App registered successfully (first time)" ;;
            *)
              REG_BODY=$(cat /tmp/register-response.json 2>/dev/null || echo "")
              if echo "$REG_BODY" | grep -qi "already"; then
                echo "✓ App already registered"
              else
                echo "Registration returned HTTP $REG_CODE: $REG_BODY"
                echo "Continuing with release upload..."
              fi
              ;;
          esac

          # Sign the release tarball
          SIGNATURE=$(openssl dgst -sha512 -sign signing-key.key nextcloud-release.tar.gz | openssl base64 -A)

          # Upload the release
          echo "Uploading release to App Store (nightly: $NIGHTLY)..."
          UPLOAD_CODE=$(curl -s -o /tmp/upload-response.json -w "%{http_code}" \
            -X POST "https://apps.nextcloud.com/api/v1/apps/releases" \
            -H "Authorization: Token ${{ secrets.NEXTCLOUD_APPSTORE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"download\": \"$DOWNLOAD_URL\", \"signature\": \"$SIGNATURE\", \"nightly\": $NIGHTLY}")

          if [ "$UPLOAD_CODE" = "200" ] || [ "$UPLOAD_CODE" = "201" ]; then
            echo "✓ Release uploaded to App Store successfully"
          else
            echo "::warning::App Store upload returned HTTP $UPLOAD_CODE"
            cat /tmp/upload-response.json 2>/dev/null || true
            echo ""
            echo "The GitHub release was created successfully. The App Store upload can be retried manually."
          fi

      # ── Summary ──

      - name: Release summary
        run: |
          echo "=== Release Summary ==="
          echo "App: ${{ inputs.app-name }}"
          echo "Type: ${{ inputs.release-type }}"
          echo "Version: ${{ env.NEW_VERSION }}"
          echo "Tag: v${{ env.NEW_VERSION }}"
          echo "Prerelease: ${{ inputs.release-type != 'stable' }}"
          echo "App Store: ${{ inputs.release-type != 'unstable' }}"
          if [ "${{ inputs.release-type }}" != "unstable" ]; then
            echo "Nightly: ${{ inputs.release-type == 'beta' }}"
          fi
          echo ""
          echo "info.xml in tarball:"
          tar -xOf nextcloud-release.tar.gz ${{ inputs.app-name }}/appinfo/info.xml | grep '<version>'
          echo ""
          echo "Tarball size: $(du -h nextcloud-release.tar.gz | cut -f1)"

      - name: Clean up signing credentials
        if: always()
        run: rm -f signing-key.key signing-cert.crt
