# app-tests-live.yml — openregister caller for the LIVE-NC reusable workflow.
#
# PHASE-5 NC-in-CI proof: makes openregister's deep e2e (tests/e2e/workflows/)
# AND Newman API-contract suite GATE on every PR — they boot a real, seeded
# Nextcloud (db + NC + OR deployed/enabled) and run against it, so a PR can no
# longer go green while those flows are broken.
#
# This is the Forgejo/Codeberg counterpart to the GitHub-Actions reference rig
# (.github/workflows/api-test-coverage.yml), which already gates Newman on
# GitHub pushes. Both boot .github/docker-compose.ci.yml; this one ALSO runs
# the deep Playwright workflows and is the fragment feature apps replicate.
# Additive — sits alongside app-tests.yml (bare gates) + the release workflows.

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    with:
      app-id: openregister
      is-openregister: true
      # GATING: both suites run against the live NC and fail the PR on a defect.
      run-e2e: true
      run-newman: true
      # NON-GATING (GAP-5): runs the visual-regression project + uploads
      # snapshots/diffs as an artifact. Committed baselines are dev-container
      # native, so they will not byte-match the CI Linux runner until
      # regenerated in-CI (see tests-live.yml run-visual caveat) — the step is
      # continue-on-error so it never blocks a PR.
      run-visual: true
      # openregister uses the orchestrator (multi-collection), restricted to the
      # self-seeding domains that don't assume dev-container fixture IDs — same
      # default set the GitHub api-test-coverage.yml rig uses.
      newman-entrypoint: tests/newman/run-all.sh
      newman-collections: "crud graphql relations auth-matrix error-matrix referential-integrity"
