# Weekly smoke run of composer check:strict against `development`.
#
# Catches silent baseline regression — i.e. the case where a PR landed quietly
# without burning down its share of the phpstan-baseline.neon or where PHPMD
# violations crept back in without being noticed.
#
# Spec ref: openspec/changes/openregister-legacy-quality-cleanup/tasks.md#5-3
name: weekly-check-strict

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Allow manual trigger from the Actions UI for ad-hoc baseline-regression checks.

jobs:
  weekly-strict:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/ci-php:8.3
    steps:
      - name: Checkout development
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: development

      - name: Install composer deps
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GH_COMPOSER_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run composer check:strict (catches silent baseline regression)
        run: composer check:strict
