  # Build, quality and release tooling: helper scripts and root-level tool configuration.
  - name: "Developer tooling"
    include:
      - ".*/scripts/.*"
      - ".*/tools/.*"
      - ".*/vendor-bin/.*"
      - ".*/[^/]*[.]config[.]m?[jt]s"
      - ".*/phpstan-bootstrap[.]php"
      - ".*/[.]php-cs-fixer[.]dist[.]php"
