  # Bootstrap, migrations, repair steps, commands, shared exceptions and helpers.
  - name: "Application wiring"
    include:
      - ".*/lib/.*[.]php"
      - ".*/appinfo/.*"
      - ".*/templates/.*[.]php"
    exclude:
