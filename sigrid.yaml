# Sigrid analysis scope for OpenRegister.
#
# Every key below is documented at
# https://docs.sigrid-says.com/reference/analysis-scope-configuration.html
# Sigrid's default excludes (node_modules, vendor, build output, docs, migrations,
# mocks and stubs) still apply on top of this file. ARCHITECTURE.md describes the
# directory roles.

# Pin the maintainability model, so a yearly recalibration never changes the
# rating without a deliberate change to this file.
model: "2026"

# Every top-level directory is a component (lib/, src/, appinfo/, templates/ ...),
# as SIG's guidance (section 2.2) defines top-level components. See ADR-014.
component_base_dirs: [""]

# Test-code patterns can only be set per language, and listing languages switches
# off automatic technology detection. The list therefore names every technology
# in the repo, so nothing that automatic detection would find is dropped.
languages:
  - name: php
    production:
    test:
      include:
        - ".*/tests/.*[.]php"
  - name: javascript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts|tsx)"
  - name: typescript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts|tsx)"
  - name: vue
    production:
    test:
      include:
        - ".*/tests/.*[.]vue"
  - name: python
    production:
    test:
      include:
        - ".*/tests?/.*[.]py"
        - ".*/test_[^/]*[.]py"
        - ".*/conftest[.]py"
  - name: script
    production:
    test:
      include:
        - ".*/tests/.*[.]sh"

# Only generated files and developer tooling are excluded.
exclude:
  # Translation catalogues. l10n/<locale>.js is generated from l10n/<locale>.json
  # (an OC.L10N.register() call around the same key/value pairs); no logic.
  - ".*/l10n/[^/]*[.]js"
  # Developer tooling: translation, quality, release and test-runner scripts.
  # Not part of the shipped app.
  - ".*/scripts/.*"
  - ".*/tools/.*"
  # Local development containers (docker/): setup scripts for the dev and demo
  # environments, not part of the shipped app.
  - ".*/docker/.*"
  # Scripts kept inside OpenSpec change folders (openspec/changes/**, archive
  # included): one-off tooling for a change, not part of the shipped app.
  - ".*/openspec/changes/.*"
  # Composer manifests for isolated developer tools.
  - ".*/vendor-bin/.*"
  # Root-level tool configuration (ESLint flat config, PHPStan bootstrap, PHP-CS-Fixer).
  - ".*/eslint[.]config[.]m?js"
  - ".*/phpstan-bootstrap[.]php"
  - ".*/[.]php-cs-fixer[.]dist[.]php"
  # Developer tooling for Claude Code under .claude/: skills, agents and their
  # configuration, partly copied from upstream (the skill-creator skill carries
  # its own Apache-2.0 licence and update script). Not part of the shipped app;
  # the skills stay in the repository for developers.
  - ".*/[.]claude/.*"

# Open Source Health.
#
# Scope: what ships. Sigrid reads package.json and composer.json without telling
# devDependencies and require-dev apart, and its configuration has no switch for
# that. The blocklist therefore names every dev-only manifest entry (build,
# lint, test and analysis tooling), so only the production dependencies are
# scored. None of these names is also a production dependency; when a package
# moves from dev to production, remove it here in the same change.
#
# The path entries drop manifests that are not part of the app at all:
# - tests/integration/package.json is the Newman test harness, which runs the
#   API tests against a dev instance. Its only findings are in newman's own
#   dependencies, with no release of newman that fixes them.
# - docs/package.json builds the Docusaurus documentation site.
# - n8n-mcp/package.json configures the n8n container of the local development
#   environment (docker-compose.yml mounts it there); nothing installs it into
#   the app.
dependencychecker:
  blocklist:
    # package.json devDependencies
    - "^@babel[:/]core$"
    - "^@babel[:/]plugin-transform-typescript$"
    - "^@babel[:/]preset-env$"
    - "^@babel[:/]preset-typescript$"
    - "^@babel[:/]traverse$"
    - "^@cyclonedx[:/]cyclonedx-npm$"
    - "^@nextcloud[:/]browserslist-config$"
    - "^@nextcloud[:/]eslint-config$"
    - "^@nextcloud[:/]prettier-config$"
    - "^@nextcloud[:/]stylelint-config$"
    - "^@nextcloud[:/]webpack-vue-config$"
    - "^@pinia[:/]testing$"
    - "^@playwright[:/]test$"
    - "^@stoplight[:/]spectral-cli$"
    - "^@types[:/]jest$"
    - "^@types[:/]node$"
    - "^@typescript-eslint[:/]parser$"
    - "^@vue[:/]test-utils$"
    - "^@vue[:/]vue3-jest$"
    - "^axe-core$"
    - "^babel-jest$"
    - "^babel-loader$"
    - "^css-loader$"
    - "^esbuild$"
    - "^eslint$"
    - "^eslint-config-prettier$"
    - "^eslint-webpack-plugin$"
    - "^jest$"
    - "^jest-environment-jsdom$"
    - "^jest-transform-stub$"
    - "^postcss$"
    - "^postcss-html$"
    - "^prettier$"
    - "^style-loader$"
    - "^stylelint$"
    - "^stylelint-config-recommended-scss$"
    - "^stylelint-config-recommended-vue$"
    - "^stylelint-webpack-plugin$"
    - "^terser-webpack-plugin$"
    - "^ts-jest$"
    - "^ts-loader$"
    - "^typescript$"
    - "^vue-eslint-parser$"
    - "^vue-loader$"
    # composer.json require-dev
    - "^conduction[:/]coding-standard$"
    - "^conduction[:/]hydra-gates$"
    - "^cyclonedx[:/]cyclonedx-php-composer$"
    - "^doctrine[:/]dbal$"
    - "^edgedesign[:/]phpqa$"
    - "^nextcloud[:/]ocp$"
    - "^phpcsstandards[:/]phpcsextra$"
    - "^phpmd[:/]phpmd$"
    - "^phpmetrics[:/]phpmetrics$"
    - "^phpstan[:/]phpstan$"
    - "^phpunit[:/]phpunit$"
    - "^roave[:/]security-advisories$"
    - "^sabre[:/]vobject$"
    - "^sabre[:/]xml$"
    - "^squizlabs[:/]php_codesniffer$"
    - "^symfony[:/]console$"
    - "^symfony[:/]http-foundation$"
    - "^vimeo[:/]psalm$"
  exclude:
    - path: ".*/tests/integration/.*"
    - path: ".*/docs/package(-lock)?[.]json"
    - path: ".*/n8n-mcp/.*"
    # These eight are the Nextcloud platform's own libraries, which a Nextcloud
    # app cannot avoid. Their AGPL and GPL licences are accepted, so only the
    # licence property is excluded: vulnerabilities, freshness, activity and
    # management are still scored. [:/] matches the scoped npm name in either
    # form, because the name Sigrid compares against is not documented.
    - license: "^@nextcloud[:/]vue$"
    - license: "^@nextcloud[:/]dialogs$"
    - license: "^@nextcloud[:/]auth$"
    - license: "^@nextcloud[:/]axios$"
    - license: "^@nextcloud[:/]l10n$"
    - license: "^@nextcloud[:/]router$"
    - license: "^@nextcloud[:/]initial-state$"
    - license: "^@nextcloud[:/]capabilities$"
    # Freshness that this app cannot change on its own.
    # The Nextcloud server ships guzzlehttp/guzzle 7, phpseclib/phpseclib 3 and
    # symfony/process and symfony/uid 6.4 in its 3rdparty (stable35: 7.15.2,
    # 3.0.55, 6.4.33 and 6.4.32). The server's
    # autoloader registers first, so the server's copy is the one that runs; a
    # newer major in this app's vendor/ would be shadowed, or would break when
    # both copies load. These follow the server's major.
    - freshness: "^guzzlehttp[:/]guzzle$"
    - freshness: "^phpseclib[:/]phpseclib$"
    - freshness: "^symfony[:/]process$"
    - freshness: "^symfony[:/]uid$"
    # zbateson/mail-mime-parser stays on 3.x by owner decision.
    - freshness: "^zbateson[:/]mail-mime-parser$"
    # apexcharts 5 and later, and vue3-apexcharts 1.9 and later, are published
    # under the proprietary ApexCharts License (paid above a revenue threshold
    # our users exceed). apexcharts 4.7 and vue3-apexcharts 1.8 are the last
    # MIT releases; .github/dependabot.yml holds both back for the same reason.
    - freshness: "^apexcharts$"
    - freshness: "^vue3-apexcharts$"

# Architecture Quality. Knowledge Awareness and Team Stability are computed from
# commit authors. Most commits here are made by AI agents, recorded either as
# "Claude" or under the name of the developer running them, so the author of a
# commit does not represent who wrote the code.
# Sigrid documents disabled_metrics for exactly that case ("Excluding
# process-related metrics" in the reference above).
architecture:
  disabled_metrics:
    - knowledge_awareness
    - team_stability
