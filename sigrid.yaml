# Sigrid analysis scope for OpenRegister.
#
# Every key below is documented at
# https://docs.sigrid-says.com/reference/analysis-scope-configuration.html
# Sigrid's default excludes (node_modules, vendor, build output, docs, migrations,
# mocks and stubs) still apply on top of this file. ARCHITECTURE.md describes the
# directory roles.

# Pin the maintainability model, so a yearly recalibration never changes the
# rating without a deliberate change to this file.
model: "2026"

# Every directory under lib/ is a component, and so is every other top-level
# directory. A new directory under lib/ becomes a component without a change here.
component_base_dirs: ["lib", ""]

# Test-code patterns can only be set per language, and listing languages switches
# off automatic technology detection. The list therefore names every technology
# in the repo, so nothing that automatic detection would find is dropped.
languages:
  - name: php
    production:
    test:
      include:
        - ".*/tests/.*[.]php"
  - name: javascript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts|tsx)"
  - name: typescript
    production:
    test:
      include:
        - ".*/tests/.*"
        - ".*/__tests__/.*"
        - ".*[.](spec|test)[.](js|mjs|cjs|ts|tsx)"
  - name: vue
    production:
    test:
      include:
        - ".*/tests/.*[.]vue"
  - name: python
    production:
    test:
      include:
        - ".*/tests?/.*[.]py"
        - ".*/test_[^/]*[.]py"
        - ".*/conftest[.]py"
  - name: script
    production:
    test:
      include:
        - ".*/tests/.*[.]sh"

# Only generated files and developer tooling are excluded.
exclude:
  # Translation catalogues. l10n/<locale>.js is generated from l10n/<locale>.json
  # (an OC.L10N.register() call around the same key/value pairs); no logic.
  - ".*/l10n/[^/]*[.]js"
  # Developer tooling: translation, quality, release and test-runner scripts.
  # Not part of the shipped app.
  - ".*/scripts/.*"
  - ".*/tools/.*"
  # Scripts kept inside OpenSpec change folders (openspec/changes/**, archive
  # included): one-off tooling for a change, not part of the shipped app.
  - ".*/openspec/changes/.*"
  # Composer manifests for isolated developer tools.
  - ".*/vendor-bin/.*"
  # Root-level tool configuration (ESLint flat config, PHPStan bootstrap, PHP-CS-Fixer).
  - ".*/eslint[.]config[.]m?js"
  - ".*/phpstan-bootstrap[.]php"
  - ".*/[.]php-cs-fixer[.]dist[.]php"
  # Developer tooling for Claude Code under .claude/: skills, agents and their
  # configuration, partly copied from upstream (the skill-creator skill carries
  # its own Apache-2.0 licence and update script). Not part of the shipped app;
  # the skills stay in the repository for developers.
  - ".*/[.]claude/.*"

# Open Source Health. These eight are the Nextcloud platform's own libraries,
# which a Nextcloud app cannot avoid. Their AGPL and GPL licences are accepted, so
# only the licence property is excluded: vulnerabilities, freshness, activity and
# management are still scored. [:/] matches the scoped npm name in either form,
# because the name Sigrid compares against is not documented.
dependencychecker:
  exclude:
    - license: "^@nextcloud[:/]vue$"
    - license: "^@nextcloud[:/]dialogs$"
    - license: "^@nextcloud[:/]auth$"
    - license: "^@nextcloud[:/]axios$"
    - license: "^@nextcloud[:/]l10n$"
    - license: "^@nextcloud[:/]router$"
    - license: "^@nextcloud[:/]initial-state$"
    - license: "^@nextcloud[:/]capabilities$"
