# Copy of sig-measure/components.yaml on the sig-lane-briefs/r12c branch (commit 01aa9863), the ADR-012
# functional block. ComponentDependencyRulesTest and scripts/component-deps.py read it only while the
# tree has no sigrid.components.yaml (lane V01); delete this copy once that file is on main.
#
# Functional components over the Nextcloud layered layout (ADR-012 v2). Generated from
# scripts/component-map.csv by build_components_clean.py: a whole directory where it belongs to one
# component, one alternation of class names per component in the flat layer directories.
# Kernel is listed first so its patterns win; every file under lib/ must match exactly one component
# (tests/Unit/Architecture/ComponentDefinitionTest). lib/Migration is excluded by Sigrid's defaults.
# r12c: lib/Kernel and lib/Support are recursive, so Kernel/Context, Kernel/Contracts/Dto, Support/Jobs and Support/Http need no new pattern.
