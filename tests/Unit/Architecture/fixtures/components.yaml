  - name: Kernel
    include:
      - ".*/lib/Contract/[^/]*"
      - ".*/lib/Db/(ObjectEntity|Register|RegisterMapperInterface|Schema|SchemaMapperInterface)[.]php"
      - ".*/lib/Dto/[^/]*"
