name: Backport

# `/backport to stableX.Y` on a pull request, or the label `backport stableX.Y`,
# cherry-picks it onto that branch once merged (ADR-122).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed, labeled]

permissions: {}

jobs:
  backport:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ConductionNL/.github/.github/workflows/backport.yml@main
    secrets: inherit
