name: Stable Release

on:
  push:
    branches: [main]

jobs:
  release:
    uses: Conduction/.github/.github/workflows/release-stable.yml@main
    with:
      app-name: openregister
      verify-vendor-deps: true
      vendor-check-paths: "openai-php/client/src,theodo-group/llphant/src"
    secrets: inherit
