name: Release

# ADR-122: a push to main publishes an unstable X.Y.0-dev.<ts> GitHub
# prerelease. beta, rc and stable are released by hand with workflow_dispatch:
# beta from main or stableX.Y, rc and stable from stableX.Y only.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release-type:
        description: "beta (main or stableX.Y), rc or stable (stableX.Y only)"
        required: true
        type: choice
        options: [beta, rc, stable]

permissions:
  contents: read

jobs:
  unstable:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    uses: ConductionNL/.github/.github/workflows/release.yml@main
    with:
      release-type: unstable
      branch-model: main
      app-name: openregister
      verify-vendor-deps: true
      vendor-check-paths: 'openai-php/client/src,theodo-group/llphant/src'
    secrets: inherit

  release:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    uses: ConductionNL/.github/.github/workflows/release.yml@main
    with:
      release-type: ${{ inputs.release-type }}
      branch-model: main
      app-name: openregister
      verify-vendor-deps: true
      vendor-check-paths: 'openai-php/client/src,theodo-group/llphant/src'
    secrets: inherit

  # Signs build provenance for the package this run released and attaches it
  # to the release: <package>.sigstore.json (the full sigstore bundle) and
  # <package>.intoto.jsonl (its DSSE envelope). The release job uploads the
  # package as the run artifact <type>-openregister-<version>, which names the
  # release this run made.
  provenance:
    needs: [unstable, release]
    if: ${{ !cancelled() && (needs.unstable.result == 'success' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download the released package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[].name | select(test("^[a-z]+-openregister-[0-9]"))][0] // ""')"
          if [ -z "$artifact" ]; then
            echo "::notice::This run released no package, so there is no provenance to sign."
            exit 0
          fi
          version="${artifact#*-openregister-}"
          tag="v$version"
          package="openregister-$version.tar.gz"
          mkdir -p dist
          gh release download "$tag" --repo "$REPO" --dir dist --pattern "$package"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=dist/$package" >> "$GITHUB_OUTPUT"

      - name: Sign build provenance
        id: attest
        if: steps.package.outputs.path != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.path }}

      - name: Attach the provenance to the release
        if: steps.package.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.package.outputs.tag }}
          PACKAGE: ${{ steps.package.outputs.path }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$PACKAGE.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "$PACKAGE.intoto.jsonl"
          gh release upload "$TAG" --repo "$REPO" --clobber \
            "$PACKAGE.sigstore.json" "$PACKAGE.intoto.jsonl"
