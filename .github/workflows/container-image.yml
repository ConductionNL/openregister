name: Container image

# Builds the evaluation image (root Dockerfile) for a release and pushes it to
# ghcr.io/conductionnl/openregister. A stable release gets its version and
# `latest`; a beta or unstable release only moves `edge`.
#
# Releases are created by the Release workflow with the workflow token, and a
# release made that way starts no other workflow. So this one follows the
# Release run instead, and builds the newest release it finds.
#
# Rendered from ConductionNL/.github templates/app-deploy.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.2.3 (empty: the newest release)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$REPO" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName')"
          fi
          [ -n "$tag" ] || { echo "::error::No release to build."; exit 1; }
          version="${tag#v}"
          image=ghcr.io/conductionnl/openregister
          case "$version" in
            *-*) tags="$image:edge" ;;
            *) tags="$image:$version,$image:latest" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Building $tag as $tags"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Record the commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
