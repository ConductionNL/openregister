# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "CI job: curl with the default admin:admin login of the throwaway Nextcloud container the job starts."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)\.github/workflows/api\-test\-coverage\.yml$''',
]

[[allowlists]]
description = "Local development stack: the AppAPI registration secrets that pair the throwaway dev Nextcloud with its ExApp containers; they protect no deployed system."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docker\-compose\.yml$''',
]

[[allowlists]]
description = "Quickstart example: curl with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docker/QUICKSTART\.md$''',
]

[[allowlists]]
description = "Documentation examples: curl with the default admin:admin login (or a user:password placeholder) of the local development container, and example UUIDs as facet keys."
targetRules = ["curl-auth-user", "generic-api-key"]
paths = [
