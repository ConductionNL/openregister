# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist is scoped to the rules that fire there,
# so any other kind of finding in those paths is still reported.
#
# A repository config replaces the scanner's built-in path exclusions, so the
# test and fixture paths those covered are listed here explicitly.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation and READMEs: curl examples with the default admin:admin login (or a user:password placeholder) of the local development container, and example UUIDs used as keys."
targetRules = ["curl-auth-user", "generic-api-key"]
paths = [
  '''^docs/''',
  '''\.md$''',
]

[[allowlists]]
description = "CI job: curl with the default admin:admin login of the throwaway Nextcloud container the job starts."
targetRules = ["curl-auth-user"]
paths = [
  '''^\.github/workflows/api\-test\-coverage\.yml$''',
]

[[allowlists]]
description = "Local development seed scripts: curl with the $NC_USER:$NC_PASS variables of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''^docker/mail/[^/]+\.sh$''',
]

[[allowlists]]
description = "Local development stacks: the AppAPI registration secrets that pair the throwaway dev Nextcloud with its ExApp containers; they protect no deployed system."
targetRules = ["generic-api-key"]
paths = [
  '''^docker\-compose[^/]*\.yml$''',
]

[[allowlists]]
description = "Spec scenarios: example API key strings and curl logins in Given/When/Then steps, not credentials."
targetRules = ["curl-auth-user", "generic-api-key", "stripe-access-token"]
paths = [
  '''^openspec/''',
]

[[allowlists]]
description = "Unit tests, fixtures and test scripts: AWS's documented example key ids, made-up tokens and secrets, seed slugs, and the default admin:admin login of the test containers."
targetRules = ["aws-access-token", "curl-auth-user", "generic-api-key", "jwt", "stripe-access-token"]
paths = [
  '''^tests/''',
]
