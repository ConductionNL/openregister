[[allowlists]]
description = "README example: curl with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)n8n\-templates/README\.md$''',
]

[[allowlists]]
description = "Spec scenarios: an example Stripe-style API key string in a Given/When/Then step, not a credential."
targetRules = ["curl-auth-user", "stripe-access-token"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-03\-06\-mcp\-discovery\-endpoint/tasks\.md$''',
  '''(^|/)openspec/changes/archive/2026\-03\-21\-data\-sync\-harvesting/specs/data\-sync\-harvesting/spec\.md$''',
