# The Nationaal Archief's own MDTO-XML 1.0.1 example documents, redistributed
# unmodified as the positive control in MdtoXmlGeneratorXsdTest — the harness
# must accept what the publisher itself calls valid. Only the file names were
# changed, to drop spaces; the bytes are upstream's, and all four sha256 sums
# in tests/fixtures/mdto/provenance.json verify against the files at this
# commit.
#
# Same publisher, same upstream commit and the same licence statement as
# lib/Resources/mdto/MDTO-XML1.0.1.xsd above, so it gets the same
# LicenseRef — Forum Standaardisatie FS-20241002.3C: "Het Nationaal Archief
# hanteert de licentie CC BY SA voor al diens kennisproducten en dus ook voor
# MDTO", with no version named. See LICENSES/LicenseRef-CC-BY-SA-
# NationaalArchief.txt.
#
# Review finding on #3857 (rjzondervan, round 3), and the sharpest counter-
# example to this file's own thesis. The argument for annotating before
# blanketing is that a blanket buries the question worth asking; here the
# ANSWER was already written down in the tree, in a sidecar next to the files,
# and the blanket relicensed four share-alike works to EUPL-1.2 anyway. The
# sibling provenance.json is Conduction's own and stays under the blanket.
[[annotations]]
path = "tests/fixtures/mdto/voorbeeld-*.xml"
precedence = "override"
SPDX-FileCopyrightText = "Nationaal Archief, https://www.nationaalarchief.nl/archiveren/mdto"
SPDX-License-Identifier = "LicenseRef-CC-BY-SA-NationaalArchief"

# Material Design Icons (Pictogrammers). Review finding on #3857: the blanket
# above would have stamped the repo's own app artwork "Conduction B.V." while
# three of these files are upstream glyph paths byte-for-byte. Verified against
# the installed packages — the `d` attribute of each occurs verbatim in
# node_modules/@mdi/js/mdi.js and in vue-material-design-icons:
#   img/lock.svg      == Lock.vue
#   img/unlock.svg    == LockOpenOutline.vue
#   img/app-dark.svg  == DatabaseSync.vue
# node_modules/@mdi/js/LICENSE (Pictogrammers Free License): "# Icons: Apache
# 2.0 … All other icons are either redistributed under their respective
# licenses or are distributed under the Apache 2.0 license." Hence
# LICENSES/Apache-2.0.txt, whose §4 attribution requirement these blocks are.
[[annotations]]
path = [
    "img/lock.svg",
    "img/unlock.svg",
    "img/app-dark.svg",
    "img/app.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/"
SPDX-License-Identifier = "Apache-2.0"

# The same MDI `database-sync` glyph, re-exported through Adobe Illustrator
# (decimal path coordinates instead of MDI's integers, same shape), placed inside
# Conduction's hexagon — `<polygon points="256,26 455.19,141 …">`, which is ours.
# Two rights holders and two licences in one file is what an `AND` expression is
# for: the glyph stays Apache-2.0, the hexagon and the composition are EUPL-1.2.
#
# `img/app.svg` is deliberately NOT here. It is the re-exported glyph and nothing
# else — no hexagon, `grep -c polygon img/app.svg` is 0 — so a Conduction
# copyright over it would be the same over-claim this file exists to avoid, and
# it sits in the Apache-2.0-only block above next to `img/app-dark.svg`, which is
# the identical drawing in MDI's own coordinate form.
#
# Replacing the glyph with our own drawing would collapse all of these back to
# the blanket; until then, silence would be the wrong answer given how this file
# frames the ordering.
[[annotations]]
path = [
    "img/app-store.svg",
    "docs/static/img/logo.svg",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "Apache-2.0 AND EUPL-1.2"

# `src/files-sidebar.js` inlines two icon glyphs rather than importing them, and
# says so itself: "// MDI icon SVG paths (inline to avoid icon library
# dependency)", with `// database-outline` and `// text-box-search-outline` above
# them.
#
# THE SWEEP THAT FOUND THIS FILE, AND THE ONE THAT SHOULD HAVE. Review finding
# on #3857 (rjzondervan, round 3): the sweep written here first looked for
# `d="…"` attributes only. That is the SVG spelling. In PHP and JS the same
# artwork is an ordinary quoted string, so the search missed the largest
# concentration of upstream glyphs in the repository — the 17 in
# lib/Service/MdiIconRenderer.php, blocked below. The sentence that reported
# "exactly four files" was therefore false at the commit that wrote it, in the
# file whose whole purpose is to be the honest inventory. The workflow comment
# at .github/workflows/code-quality.yml argues that hand-maintained counts go
# stale inside the pull request that writes them; it was right about itself and
# it was right about this file too.
#
# Corrected method — every quoted string in every tracked file (not just `d="…"`,
# not just `img/`) that looks like an SVG path, tested for byte-identity against
# node_modules/@mdi/js/mdi.js 7.4.47. Rather than a count that can rot, the full
# result, and the command to re-derive it:
#
#   img/app-dark.svg                   mdiDatabaseSync
#   img/lock.svg                       mdiLock
#   img/unlock.svg                     mdiLockOpenOutline
#   lib/Service/MdiIconRenderer.php    17 glyphs, see its own block below
#   src/files-sidebar.js               mdiDatabaseOutline
#
# Re-derive with: extract `export var mdi\w+ = "…"` from @mdi/js/mdi.js into a
# set, then grep every tracked file for quoted strings matching ^[Mm][0-9A-Za-z
# ,.-]{39,}$ and test membership. Anything it reports that has no block here is
# a gap, not a judgement call.
#
# The `database-outline` path here is byte-identical to MDI's; the
# `text-box-search-outline` one is not present in the installed package (a
# different MDI release, or hand-adjusted), but the file declares it as MDI and
# an assertion of sole Conduction authorship over it would not be supportable.
#
# The rest of the file is Conduction's own sidebar registration, hence `AND`
# rather than an Apache-2.0-only block. `src/icons.js` and
# `src/mail-sidebar/icons.js` only IMPORT from vue-material-design-icons and
# embed no artwork, so they stay under the blanket.
[[annotations]]
path = "src/files-sidebar.js"
precedence = "override"
SPDX-FileCopyrightText = [
    "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "Apache-2.0 AND EUPL-1.2"

# `lib/Service/MdiIconRenderer.php` renders an MDI reference into a self-hosted
# `data:` SVG URI, because a bare icon name does not render in Nextcloud unified
# search results and the CSP blocks icon CDNs. To do that it embeds the artwork:
# all 17 entries of its PATHS constant are byte-identical to @mdi/js 7.4.47 —
# mdiDog, mdiCat, mdiBird, mdiFish, mdiTurtle, mdiPaw, mdiAccount,
# mdiAccountGroup, mdiTag, mdiShape, mdiCartOutline, mdiStethoscope,
# mdiClipboardPulse, mdiMedicalBag, mdiCalendar, mdiDatabase and
# mdiFileDocumentOutline. The file states its source twice in its own docblock
# ("a curated subset of @mdi/js", "the SVG `path` `d` data from Material Design
# Icons v7"), so this was never a hidden dependency — only an unrecorded one.
#
# That is 17× the upstream expression in src/files-sidebar.js above, and it sat
# under a sole-Conduction EUPL-1.2 header until #3857 round 3. The file's own
# header has been corrected in the same commit as this block, so the source is
# honest when read on its own; this block is the machine-readable half and says
# the same thing deliberately. Replacing the glyphs with our own drawings would
# collapse it back to the blanket.
[[annotations]]
path = "lib/Service/MdiIconRenderer.php"
precedence = "override"
SPDX-FileCopyrightText = [
    "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "Apache-2.0 AND EUPL-1.2"

