version = 1
SPDX-PackageName = "openregister"
SPDX-PackageSupplier = "Conduction B.V. <info@conduction.nl>"
SPDX-PackageDownloadLocation = "https://github.com/ConductionNL/openregister"

# REUSE / SPDX declaration for OpenRegister (WOO-579, 2026-09-17).
#
# WHY THIS FILE EXISTS. `quality / REUSE compliance` (fsfe/reuse-action@v5,
# shared quality.yml) had been red on every run of this repository: 3,049 of
# 9,145 files carried an SPDX header, but there was no LICENSES/ directory, so
# every `SPDX-License-Identifier: EUPL-1.2` pointed at a licence text that was
# not in the tree, and the other 6,096 files (openspec documents, l10n JSON,
# docs, screenshots, fixtures, lockfiles, tests and migrations without a
# docblock) had no licensing information at all by REUSE's definition. The
# row in the Quality Report said ❌; the job said success, because
# `reuse-blocking` defaulted to false. Nobody was blocked and nobody looked.
#
# Headers on those 6,096 files would be the other fix, and it is the wrong one
# for most of them: l10n/*.json is machine-generated and an SPDX comment is not
# valid JSON, lockfiles are rewritten by the package managers, and a PNG has
# nowhere to carry a comment. The blanket below is what the specification is
# for. PHP files keep carrying their own SPDX lines per ADR-014 — the blanket
# only fills in what has none.
#
# HOW PRECEDENCE WORKS HERE (REUSE spec 3.3). When several tables match a file,
# the LAST matching table in this file wins. `precedence = "closest"` means a
# file's OWN header beats the table (the table only fills gaps);
# `precedence = "override"` means the table beats the header. The blanket comes
# first and uses `closest`; every third-party block comes after it and uses
# `override`, because a .xsd, .jsonld, .pdf or tokenizer.json cannot carry a
# header and we assert its provenance here on the publisher's behalf. Same
# model as keepiq and portaliq.
#
# THE ORDER THIS WAS WRITTEN IN MATTERS. The third-party inventory below was
# done BEFORE the blanket was added — a blanket first would have stamped every
# one of these files "Conduction B.V. / EUPL-1.2", flipped `compliant` to true,
# and buried exactly the question worth asking. Add a vendored file? Add its
# block here first, then run `reuse lint`.

# ---------------------------------------------------------------------------
# Repo-wide default: everything Conduction wrote, in whatever format.
# ---------------------------------------------------------------------------
#
# `closest` also means the two Nextcloud-derived files keep their own truth:
# `.editorconfig` carries "2019 Nextcloud GmbH and Nextcloud contributors /
# AGPL-3.0-or-later" in its own header, which is why LICENSES/ contains
# AGPL-3.0-or-later.txt. The three `patches/*.patch` are Conduction's own
# changes to MIT-licensed upstream code (LLPhant, PhpSpreadsheet); the added
# lines are ours and the context lines quote upstream under MIT, which permits
# that. They stay EUPL-1.2 under this blanket. The files that say
# "Open Register Contributors" instead of "Conduction B.V." keep their own
# header too — the copyright text differs, the licence does not.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

# ---------------------------------------------------------------------------
# Third party. NOT ours — these say what the publisher says. Each block names
# its source; lib/Resources/*/version.json records the exact upstream release,
# retrieval date and, where the publisher was explicit, the licence statement.
# ---------------------------------------------------------------------------

# Schema.org vocabulary, a curated subset of the official release 27.01
# (lib/Resources/schemaorg/version.json). schema.org/docs/terms.html: "The
# Sponsors' copyrights in the schema are licensed to website publishers and
# other third parties under the Creative Commons Attribution-ShareAlike License
# (version 3.0)." A subset is an adaptation, so share-alike keeps it CC-BY-SA.
# The sibling version.json is Conduction's and stays under the blanket.
[[annotations]]
path = "lib/Resources/schemaorg/schemaorg-current-https.jsonld"
precedence = "override"
SPDX-FileCopyrightText = "Schema.org sponsors (Google, Microsoft, Yahoo, Yandex) and contributors, https://schema.org"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# MDTO-XML 1.0.1, the Nationaal Archief's XML Schema Definition for MDTO,
# redistributed unmodified (sha256 in lib/Resources/mdto/version.json). The
# publisher's only licence statement is Forum Standaardisatie's intake advice
# FS-20241002.3C: "Het Nationaal Archief hanteert de licentie CC BY SA voor al
# diens kennisproducten en dus ook voor MDTO." No version is named and the
# upstream repository (NationaalArchief/MDTO-XSD) has no LICENSE file, so
# claiming `CC-BY-SA-4.0` would say more than the publisher did. The
# LicenseRef text in LICENSES/ quotes the statement and its source verbatim;
# swap it for the SPDX identifier the day the Nationaal Archief names one.
[[annotations]]
path = "lib/Resources/mdto/MDTO-XML1.0.1.xsd"
precedence = "override"
SPDX-FileCopyrightText = "Nationaal Archief, https://www.nationaalarchief.nl/archiveren/mdto"
SPDX-License-Identifier = "LicenseRef-CC-BY-SA-NationaalArchief"

# TOOI value lists (DiWoo documenthandelingen, informatiecategorieën) from
# KOOP, rendered as SKOS JSON-LD. The value-list DATA is published on
# data.overheid.nl under CC0 1.0; the TOOI specification DOCUMENTS are
# CC BY 4.0 but none of their text is in these files.
[[annotations]]
path = "lib/Resources/Vocabulary/tooi-*.jsonld"
precedence = "override"
SPDX-FileCopyrightText = "Kennis- en Exploitatiecentrum Officiële Overheidspublicaties (KOOP), https://standaarden.overheid.nl/tooi"
SPDX-License-Identifier = "CC0-1.0"

# Gemeentelijk Gegevensmodel 2.2.0, normalised by tools/generate-ggm-snapshot.php
# with the Dutch names and definitions preserved verbatim. The GGM LICENSE
# (Gemeente-Delft/Gemeentelijk-Gegevensmodel) puts the model itself — "UML,
# JSON-schema's, tabellen en definities" — under EUPL-1.2. Same licence as
# ours, different rights holder, hence a block of its own rather than the
# blanket: the definitions are Delft's, the normalisation is Conduction's.
[[annotations]]
path = "lib/Resources/ggm/ggm-snapshot.json"
precedence = "override"
SPDX-FileCopyrightText = [
    "2025 Gemeente Delft, https://github.com/Gemeente-Delft/Gemeentelijk-Gegevensmodel",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "EUPL-1.2"

# ByteDance's Dolphin document-parsing model: the Hugging Face model card
# (README.md), tokenizer and config JSON and the HF .gitattributes, copied from
# https://huggingface.co/ByteDance/Dolphin for the optional `dolphin-vlm`
# service in docker-compose.dev.yml. The model card: "This model is released
# under the MIT License." The weights are not in git. Dockerfile and
# api_server.py next to it are Conduction's and stay under the blanket.
[[annotations]]
path = "docker/dolphin/models/**"
precedence = "override"
SPDX-FileCopyrightText = "ByteDance, https://huggingface.co/ByteDance/Dolphin"
SPDX-License-Identifier = "MIT"

# Test fixture copied from `examples/testdoc.pdf` in ddn/sapp
# (https://github.com/dealfonso/sapp), which is LGPL-3.0-or-later per its
# composer.json; committed here because the package marks /examples
# export-ignore, so the dist archive does not ship it (see
# tests/Unit/Service/TextExtraction/PdfExtractorTest.php).
[[annotations]]
path = "tests/fixtures/pdf/testdoc.pdf"
precedence = "override"
SPDX-FileCopyrightText = "Carlos de Alfonso and the ddn/sapp contributors, https://github.com/dealfonso/sapp"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Material Design Icons (Pictogrammers). Review finding on #3857: the blanket
# above would have stamped the repo's own app artwork "Conduction B.V." while
# three of these files are upstream glyph paths byte-for-byte. Verified against
# the installed packages — the `d` attribute of each occurs verbatim in
# node_modules/@mdi/js/mdi.js and in vue-material-design-icons:
#   img/lock.svg      == Lock.vue
#   img/unlock.svg    == LockOpenOutline.vue
#   img/app-dark.svg  == DatabaseSync.vue
# node_modules/@mdi/js/LICENSE (Pictogrammers Free License): "# Icons: Apache
# 2.0 … All other icons are either redistributed under their respective
# licenses or are distributed under the Apache 2.0 license." Hence
# LICENSES/Apache-2.0.txt, whose §4 attribution requirement these blocks are.
[[annotations]]
path = [
    "img/lock.svg",
    "img/unlock.svg",
    "img/app-dark.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/"
SPDX-License-Identifier = "Apache-2.0"

# The same MDI `database-sync` glyph, re-exported through Adobe Illustrator
# (decimal path coordinates instead of MDI's integers, same shape). `img/app.svg`
# is the glyph alone; `img/app-store.svg` and `docs/static/img/logo.svg` place it
# inside Conduction's hexagon, which is ours. Two rights holders and two licences
# in one file is what an `AND` expression is for — the glyph stays Apache-2.0,
# the hexagon and the composition are EUPL-1.2. Replacing the glyph with our own
# drawing would collapse these three back to the blanket; until then, silence
# would be the wrong answer given how this file frames the ordering.
[[annotations]]
path = [
    "img/app.svg",
    "img/app-store.svg",
    "docs/static/img/logo.svg",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "Austin Andrews and the Pictogrammers contributors, https://pictogrammers.com/library/mdi/",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "Apache-2.0 AND EUPL-1.2"

# ZGW example exports. The wrapper is an OpenRegister configuration export
# (mappings, endpoints, our own metadata), but the embedded schema definitions
# reproduce VNG Realisatie's ZGW API definitions verbatim — 25 occurrences of
# "URL-referentie naar dit object. Dit is de unieke identificatie en locatie van
# dit object" across the four files, plus siblings like "Unieke resource
# identifier (UUID4)". The sibling project.md names the four upstream standards
# it was built from (ZTC/ZRC/DRC/BRC).
#
# Upstream licences, read from the repositories themselves: zaken-api
# LICENCE.md, documenten-api LICENCE.md and besluiten-api LICENSE.md each say
# "Copyright © VNG Realisatie 2018 / Licensed under the EUPL" followed by the
# "EUROPEAN UNION PUBLIC LICENCE v. 1.2" text; catalogi-api LICENSE adds
# "Zaaktypecatalogus, copyright (C) 2017 Maykin Media B.V, 2018 VNG Realisatie"
# and links eupl.eu/1.2. Same licence as ours, different rights holder — the
# ggm-snapshot.json case exactly, so it gets the same treatment rather than the
# blanket.
[[annotations]]
path = "docs/static/oas/Examples/ZaakRegister/*.json"
precedence = "override"
SPDX-FileCopyrightText = [
    "2017 Maykin Media B.V.",
    "2018 VNG Realisatie, https://github.com/VNG-Realisatie",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "EUPL-1.2"
