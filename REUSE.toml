SPDX-License-Identifier = "EUPL-1.2"



# Our patches against upstream MIT code. Review finding on #3857 (rjzondervan):
# the licence conclusion was right — theodo-group/llphant 1.0.1 and
# phpoffice/phpspreadsheet 5.9.0 are MIT per composer.lock, and the reproduced
# context (6, 12 and 7 lines respectively, `grep -cE '^ ' patches/*.patch`) is
# nowhere near a substantial portion — but the COPYRIGHT field was not: the
# blanket asserted "2026 Conduction B.V." over context lines that are
# demonstrably LLPhant's and PhpSpreadsheet's. That is the ggm-snapshot.json
# shape again, so it gets the same dual-holder treatment.
#
# Two blocks rather than one, because each patch touches exactly one upstream:
# the LLPhant patches are against src/Chat/OllamaChat.php, the PhpSpreadsheet
# patch against src/PhpSpreadsheet/Writer/ZipStream0.php. One combined block
# would put PhpSpreadsheet's copyright on a file containing none of its code —
# a smaller version of the error being fixed here.
[[annotations]]
path = "patches/llphant-*.patch"
precedence = "override"
SPDX-FileCopyrightText = [
    "The LLPhant contributors, https://github.com/theodo-group/LLPhant",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "MIT AND EUPL-1.2"

[[annotations]]
path = "patches/phpspreadsheet-*.patch"
precedence = "override"
SPDX-FileCopyrightText = [
    "The PhpSpreadsheet contributors, https://github.com/PHPOffice/PhpSpreadsheet",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "MIT AND EUPL-1.2"

# Docusaurus classic-template scaffolding. Review finding on #3857
# (rjzondervan), raised as "the same class as the icons and the ZGW examples,
# and a reviewer may want all three decided by one consistent rule". They are,
# and the rule is the one at the top of this file: if the expression in a file
# originated with someone else, name them — being generator output is not a
# reason for silence, only a reason not to block on it.
#
# docs/src/css/custom.css still opens with the template's own comment ("Any CSS
# included here will be global. The classic template bundles Infima by
# default…"); docs/src/components/HomepageFeatures/index.js keeps the template
# structure (`FeatureList`, `function Feature({title, description})`,
# `clsx('col col--4')`) with only the copy swapped; the two *.module.css files
# are the template's rules. Docusaurus is MIT, © Meta Platforms, Inc. and
# affiliates.
#
# `docs/sidebars.js` is the strongest case of the five: everything between its
# first and last line is byte-identical to the template's `sidebars.js`,
# commented-out `'intro' / 'hello' / 'tutorial-basics/create-a-document'`
# example included; only the header comment and `module.exports` vs
# `export default` differ.
#
# docs/src/pages/index.js is NOT here on purpose: it was rewritten to compose
# @conduction/docusaurus-preset components and keeps none of the template's
# body, so it stays under the blanket. `docs/docusaurus.config.js` shares only
# the `// @ts-check` line and is otherwise ours; also left on the blanket.
[[annotations]]
path = [
    "docs/src/css/custom.css",
    "docs/src/components/HomepageFeatures/index.js",
    "docs/src/components/HomepageFeatures/styles.module.css",
    "docs/src/pages/index.module.css",
    "docs/sidebars.js",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "Meta Platforms, Inc. and affiliates, https://github.com/facebook/docusaurus",
    "2026 Conduction B.V. <info@conduction.nl>",
]
SPDX-License-Identifier = "MIT AND EUPL-1.2"

# ---------------------------------------------------------------------------
# Not third party — ours, but read differently. The block below is Conduction's
# own material; it sits here rather than under the blanket because the reason
# for it is the reading mechanism, not the rights holder.
# ---------------------------------------------------------------------------

# Archived openspec documents. Review finding on #3857 (rjzondervan): this PR
# had reworded one sentence in an ARCHIVED tasks.md because reuse read its
# quoted SPDX tag as a malformed licence expression. The repo states the
# convention in an archived document of its own —
# openspec/changes/archive/2026-06-14-lifecycle-notifications-amendments/tasks.md:22,
# "openspec archive directories are convention-treated as immutable history" —
# so the sentence is restored byte-for-byte and the lint is satisfied here
# instead.
#
# `override` rather than `closest` is the whole point: it makes reuse stop
# reading these files' contents for licensing tags, so a document that QUOTES
# an SPDX tag while describing work no longer fails the build. That generalises
# to every future archived document, which is what the one-path fix would not
# do. These are all Conduction's own change records; nothing third-party is
# archived here.
#
# For a document that is still editable, the fix is reuse's own
# `REUSE-IgnoreStart` / `REUSE-IgnoreEnd` around the quoted tag — see the
# comment at `reuse-blocking` in .github/workflows/code-quality.yml.
[[annotations]]
path = "openspec/changes/archive/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"
